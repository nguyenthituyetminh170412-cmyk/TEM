<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TÉM — E-Wallet</title>
    <link rel="stylesheet" href="../static/css/styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <a href="index.html">TÉM</a>
      </div>

      <nav class="nav-menu">
        <a href="index.html">HOME</a>
        <a href="shop.html">SHOP</a>
        <a href="newin.html">NEW IN</a>
        <a href="sale.html">SALE</a>
      </nav>

      <div class="auth-buttons" id="authButtons"></div>
    </header>

    <main class="wallet-page">
      <section class="shop-header">
        <p>TÉM / ACCOUNT</p>
        <h1>E-WALLET</h1>
        <span>Manage your TÉM wallet.</span>
      </section>

      <section class="wallet-container">
        <div class="wallet-card">
          <p class="wallet-label">AVAILABLE BALANCE</p>

          <h2 id="walletBalance">0 VND</h2>

          <button type="button" id="addMoneyBtn" class="wallet-primary-btn">
            ADD MONEY
          </button>

          <p class="wallet-note">Demo wallet for TÉM shopping.</p>
        </div>

        <div class="wallet-history">
          <div class="wallet-section-title">
            <div>
              <p>ACCOUNT ACTIVITY</p>
              <h2>TRANSACTION HISTORY</h2>
            </div>
          </div>

          <div id="transactionList">
            <p class="wallet-empty">No transactions yet.</p>
          </div>
        </div>
      </section>
    </main>

    <div class="wallet-modal" id="walletModal">
      <div class="wallet-modal-box">
        <button type="button" class="wallet-close" id="closeWalletModal">
          ×
        </button>

        <p>WALLET</p>

        <h2>ADD MONEY</h2>

        <form id="walletForm">
          <label for="walletAmount"> AMOUNT </label>

          <input
            type="number"
            id="walletAmount"
            min="1000"
            step="1000"
            placeholder="100000"
            required
          />

          <p id="walletMessage"></p>

          <button type="submit" class="wallet-primary-btn">
            ADD TO WALLET
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="../static/js/wallet.js"></script>
    <script type="module" src="../static/js/header.auth.js"></script>
  </body>
</html>
