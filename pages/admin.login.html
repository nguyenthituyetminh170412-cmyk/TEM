<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TÉM — Admin Login</title>
    <link rel="stylesheet" href="../static/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <p class="auth-eyebrow">TÉM / ADMINISTRATION</p>
      <h1>ADMIN LOGIN</h1>
      <p class="auth-subtitle">Sign in to access the TÉM management system.</p>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">EMAIL</label>
          <input
            type="email"
            id="adminEmail"
            placeholder="admin@temfashion.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="adminPassword">PASSWORD</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="Enter password"
            required
          />
        </div>
        <p id="adminLoginMessage" class="auth-message"></p>
        <button type="submit" class="auth-submit-btn">SIGN IN AS ADMIN</button>
      </form>
      <div class="auth-footer">
        <a href="./index.html">← BACK TO STORE</a>
      </div>
    </div>
    <script type="module" src="../static/js/admin.login.js"></script>
    <script type="module" src="../static/js/header.auth.js"></script>
  </body>
</html>
